<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<!-- A single-page-app login form (Vue/React style): the fields have NO name
     attributes (framework-bound), the form has NO action, and the submit is a
     <button type="button"> with a JS click handler rather than a native
     submit. There is also a label-less icon button (a password toggle) that
     must NOT become a submit control. lynx must still get a pressable button,
     and the typed values must reach the JS handler. -->
<h1>Sign in</h1>
<form method="post" role="form">
  <div class="form-group">
    <input type="text" class="login-input" placeholder="Username">
  </div>
  <div class="password-wrapper">
    <input type="password" class="login-input" placeholder="Password">
    <button type="button" class="password-toggle"><svg width="18" height="18"></svg></button>
  </div>
  <button type="button" class="login-btn-primary">Log in</button>
</form>
<p id="result">not submitted</p>
<script>
document.querySelector('.login-btn-primary').addEventListener('click', function () {
    var user = document.querySelector('input[type="text"]').value;
    var pass = document.querySelector('input[type="password"]').value;
    // A real app would POST via fetch; here we just record what the handler saw,
    // proving the typed values reached it and the JS button fired.
    document.getElementById('result').textContent =
        'LOGGED-IN user=' + user + ' passlen=' + pass.length;
});
</script>
</body>
</html>
