<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Security check — Example</title>
</head>
<body>
<h1>Security check</h1>
<p>Enter the code we sent to your phone to finish signing in.</p>
<form action="verify" method="post">
  <p>
    <label for="otp">Verification code</label>
    <input type="text" name="otp" id="otp" inputmode="numeric" autocomplete="one-time-code">
  </p>
  <p><input type="submit" value="Verify"></p>
</form>
<p><a href="/resend">Resend code</a></p>
</body>
</html>
